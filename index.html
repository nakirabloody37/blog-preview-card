<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />

    <link rel="stylesheet" href="style.css" />

    <title>Blog preview card</title>
  </head>
  <body>
    <main class="blog-preview-card">
      <img
        src="assets/images/illustration-article.svg"
        alt="An illustration"
        class="card-img"
      />
      <div class="tag-box">
        <p class="tag">Learning</p>
        <p class="date"></p>
        Published 21 Dec 2023
      </div>
      <h1 class="heading-primary">HTML & CSS foundations</h1>
      <p class="card-description">
        These languages are the backbone of every website, defining structure,
        content, and presentation.
      </p>

      <figure class="greg">
        <img
          src="assets/images/image-avatar.webp"
          alt="Greg Hooper"
          class="greg-img"
        />
        <figcaption class="greg-hooper">Greg Hooper</figcaption>
      </figure>
    </main>

    <footer class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
      Coded by
      <a href="https://www.frontendmentor.io/profile/nakirabloody37">NAkira</a>.
    </footer>
  </body>
</html>
