<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />

    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;800&display=swap"
      rel="stylesheet"
    />

    <title>Blog preview card</title>
  </head>
  <body>
    <main class="blog-preview-card">
      <img
        src="assets/images/illustration-article.svg"
        alt="An illustration"
        class="card-img"
      />
      <div class="tag-box">
        <span class="tag">Learning</span>
        <span class="date">Published 21 Dec 2023</span>
      </div>
      <h1 class="heading-primary">HTML & CSS foundations</h1>
      <p class="card-description">
        These languages are the backbone of every website, defining structure,
        content, and presentation.
      </p>

      <figure class="greg">
        <img
          src="assets/images/image-avatar.webp"
          alt="Greg Hooper's profile picture"
          class="greg-img"
        />
        <figcaption class="greg-hooper">Greg Hooper</figcaption>
      </figure>
    </main>

    <footer class="attribution">
      <p>
        Challenge by
        <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a
        >.
      </p>
      <p>
        Coded by
        <a href="https://www.frontendmentor.io/profile/nakirabloody37"
          >NAkira</a
        >
        (I use a nickname here for privacy reasons.)
      </p>
    </footer>
  </body>
</html>
